spring.application.name=personal
server.address=127.0.0.1
# Use the existing local H2 file; never create an empty database on startup.
spring.datasource.url=jdbc:h2:file:./data/personal;MODE=MySQL;IFEXISTS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
app.bill.import-dir=./bill/pending
app.bill.scan-delay-ms=300000
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
